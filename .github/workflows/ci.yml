name: CI

on:
  push:
    branches:
      - main
      - develop-*
      - feature/**
      - bugfix/**
      - hotfix/**
  pull_request:
    branches:
      - main
      - develop-*

permissions:
  contents: read

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
